<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OpenGaze content-script test page</title>
    <style>
      body {
        font: 18px system-ui;
        margin: 40px;
        height: 2400px;
      }
      #big {
        position: absolute;
        left: 200px;
        top: 200px;
        width: 240px;
        height: 120px;
        font-size: 22px;
      }
      #near a {
        margin-right: 6px;
      }
      #near {
        position: absolute;
        left: 700px;
        top: 220px;
      }
      #list {
        position: absolute;
        left: 700px;
        top: 420px;
        margin: 0;
        columns: 2;
        font-size: 16px;
      }
      #q {
        position: absolute;
        left: 200px;
        top: 420px;
        width: 300px;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <!-- Dev-only harness: stubs the extension APIs and streams synthetic gaze frames to the content script. -->
    <button id="big" onclick="this.textContent = 'Clicked ' + ++window.clicks">Big button</button>
    <div id="near"><a href="#one">one</a><a href="#two">two</a><a href="#three">three</a></div>
    <ol id="list">
      <li><a href="#l1">Apple</a></li>
      <li><a href="#l2">Banana</a></li>
      <li><a href="#l3">Cherry</a></li>
      <li><a href="#l4">Date</a></li>
      <li><a href="#l5">Elderberry</a></li>
      <li><a href="#l6">Fig</a></li>
      <li><a href="#l7">Grape</a></li>
      <li><a href="#l8">Honeydew</a></li>
      <li><a href="#l9">Kiwi</a></li>
      <li><a href="#l10">Lemon</a></li>
      <li><a href="#l11">Mango</a></li>
    </ol>
    <form
      id="f"
      onsubmit="
        event.preventDefault();
        document.title = 'searched:' + q.value;
      "
    >
      <input id="q" placeholder="Search" />
    </form>
    <script>
      window.clicks = 0;
      window.__OG_HARNESS__ = true;
      const store = {};
      const listeners = { msg: [], disc: [] };
      const port = {
        onMessage: { addListener: (f) => listeners.msg.push(f) },
        onDisconnect: { addListener: (f) => listeners.disc.push(f) },
        disconnect() {},
        postMessage(m) {
          if (m.type === 'want-preview') window.wantPreview = m.on;
        },
      };
      window.chrome = {
        runtime: { id: 'test', lastError: undefined, connect: () => port },
        storage: {
          local: { get: async () => store, set: async (o) => Object.assign(store, o) },
          onChanged: { addListener() {} },
        },
      };
      // A "model" that ignores features and always predicts window.target (intercept-only ridge model).
      const N = 11,
        P = 11 + 10 + 2;
      window.target = [320, 260];
      function calib() {
        return {
          model: {
            featMean: Array(N).fill(0),
            featScale: Array(N).fill(1),
            termMean: Array(P).fill(0),
            w: Array.from({ length: P }, () => [0, 0]),
            b: window.target.slice(),
            lambda: 0.1,
          },
          headRef: { mean: { yaw: 0, pitch: 0, roll: 0, tx: 0, ty: 0, tz: -50 }, nose: { x: 0.5, y: 0.5 } },
          accuracy: { meanPx: 40, p95Px: 90, meanDeg: 1.5, grade: 'Excellent' },
          frame: { left: 0, top: 0, scale: 1 },
          dpr: devicePixelRatio,
          at: Date.now(),
        };
      }
      const mode = new URLSearchParams(location.search).get('mode') || 'head';
      Object.assign(store, { enabled: true, dwellMs: 600, calibration: calib(), pointer: mode, headRange: 'medium' });
      // Head mode: start looking at the centre (neutral pose), with a little natural jitter.
      if (mode === 'head') window.target = [innerWidth / 2, innerHeight / 2];
      const NEUTRAL = { x: 0, y: 0.6 },
        RANGE = 0.15;
      window.jitter = 0.004;
      function tiltFor([X, Y]) {
        const j = () => (Math.random() - 0.5) * 2 * window.jitter;
        return {
          x: NEUTRAL.x - ((X - innerWidth / 2) / (innerWidth / 2)) * RANGE + j(),
          y: NEUTRAL.y + ((Y - innerHeight / 2) / (innerHeight / 2)) * RANGE * 0.65 + j(),
        };
      }
      window.aim = (x, y) => {
        window.target = [x, y];
        store.calibration = calib();
      };
      document.hasFocus = () => true;
      setInterval(() => {
        // Make the "screen" frame match this viewport so the identity mapping holds.
        store.calibration.frame = {
          left: window.screenX + (window.outerWidth - window.innerWidth) / 2,
          top: window.screenY + window.outerHeight - window.innerHeight - (window.outerWidth - window.innerWidth) / 2,
          scale: 1,
        };
        const jj = () => (Math.random() - 0.5) * 2 * (window.eyeNoise || 0);
        store.calibration.model.b = [window.target[0] + jj(), window.target[1] + jj()];
        const msg = {
          type: 'frame',
          t: performance.now(),
          face: true,
          v: Array(N).fill(0),
          head: { yaw: 0, pitch: 0, roll: 0, tx: 0, ty: 0, tz: -50 },
          blinkL: 0,
          blinkR: 0,
          nose: { x: 0.5, y: 0.5 },
          eyeRatio: 0.15,
          tilt: tiltFor(window.target),
        };
        listeners.msg.forEach((f) => f(msg));
        // Fake camera thumbnail (a gradient with a face-ish dot) when the overlay asks for it.
        if (window.wantPreview && (window.__tick = (window.__tick || 0) + 1) % 3 === 0) {
          const c = document.createElement('canvas');
          c.width = 160;
          c.height = 90;
          const g = c.getContext('2d');
          g.fillStyle = '#335';
          g.fillRect(0, 0, 160, 90);
          g.fillStyle = '#e9c';
          g.beginPath();
          g.arc(80, 45, 22, 0, 7);
          g.fill();
          listeners.msg.forEach((f) => f({ type: 'preview', url: c.toDataURL('image/jpeg', 0.6) }));
        }
      }, 33);
    </script>
    <script src="/dist-extension/content.js"></script>
  </body>
</html>
